<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Survivorship Curves Comparator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: aliceblue;
            user-select: none;
        }
        .container {
            max-width: 100%;
            padding: 6px 10px;
        }
        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 4px;
        }
        .action-btn {
            padding: 5px 14px;
            border: 1px solid #999;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .reset-btn { background: #95a5a6; color: white; border-color: #7f8c8d; }
        .reset-btn:hover { background: #7f8c8d; }
        .hint-btn { background: #f39c12; color: white; border-color: #e67e22; }
        .hint-btn:hover { background: #e67e22; }
        .hint-btn.active { background: #d35400; }
        .score-display {
            font-size: 13px;
            font-weight: bold;
            color: #2c3e50;
            margin-left: auto;
        }
        .main-area {
            display: flex;
            gap: 10px;
        }
        .chart-wrapper {
            flex: 1;
            position: relative;
            min-width: 0;
        }
        .chart-container {
            position: relative;
            height: 370px;
        }
        /* Drop zones overlay the chart */
        .drop-overlay {
            position: absolute;
            left: 60px;   /* approximate chart area left edge */
            right: 10px;  /* approximate chart area right edge */
            border: 2px dashed transparent;
            border-radius: 8px;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            align-content: flex-start;
            gap: 3px;
            padding: 4px 8px;
            transition: all 0.2s;
            z-index: 10;
            cursor: default;
        }
        .drop-overlay .zone-label {
            font-size: 12px;
            font-weight: bold;
            pointer-events: none;
            width: 100%;
            margin-bottom: 2px;
        }
        /* Three zones stacked vertically over the chart */
        .drop-type1 {
            top: 30px;
            height: 28%;
            background: rgba(52, 152, 219, 0.06);
            border-color: rgba(52, 152, 219, 0.3);
        }
        .drop-type1 .zone-label { color: #2980b9; }
        .drop-type2 {
            top: calc(30px + 28% + 4px);
            height: 28%;
            background: rgba(39, 174, 96, 0.06);
            border-color: rgba(39, 174, 96, 0.3);
        }
        .drop-type2 .zone-label { color: #1e8449; }
        .drop-type3 {
            top: calc(30px + 56% + 8px);
            height: 28%;
            background: rgba(230, 126, 34, 0.06);
            border-color: rgba(230, 126, 34, 0.3);
        }
        .drop-type3 .zone-label { color: #d35400; }
        .drop-overlay.drag-over {
            border-style: solid;
        }
        .drop-type1.drag-over { background: rgba(52, 152, 219, 0.15); border-color: #3498db; }
        .drop-type2.drag-over { background: rgba(39, 174, 96, 0.15); border-color: #27ae60; }
        .drop-type3.drag-over { background: rgba(230, 126, 34, 0.15); border-color: #e67e22; }
        .drop-overlay.selected-target {
            border-style: solid;
            animation: pulse-border 0.8s ease-in-out infinite alternate;
        }
        @keyframes pulse-border {
            from { border-width: 2px; }
            to { border-width: 3px; }
        }
        .drop-type1.selected-target { background: rgba(52, 152, 219, 0.12); border-color: #3498db; }
        .drop-type2.selected-target { background: rgba(39, 174, 96, 0.12); border-color: #27ae60; }
        .drop-type3.selected-target { background: rgba(230, 126, 34, 0.12); border-color: #e67e22; }

        .organism-panel {
            width: 180px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .panel-title {
            font-size: 12px;
            font-weight: bold;
            color: #555;
            text-align: center;
            margin-bottom: 2px;
        }
        .organism-chip {
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: grab;
            text-align: center;
            transition: all 0.2s;
            border: 2px solid #ccc;
            background: white;
        }
        .organism-chip:hover { transform: scale(1.03); box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
        .organism-chip.dragging { opacity: 0.5; cursor: grabbing; }
        .organism-chip.selected {
            border-color: #8e44ad;
            background: #f5eef8;
            box-shadow: 0 0 8px rgba(142,68,173,0.4);
            transform: scale(1.05);
        }
        .placed-chip {
            display: inline-block;
            padding: 2px 6px;
            margin: 1px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            pointer-events: none;
        }
        .placed-correct { background: rgba(213, 245, 227, 0.9); color: #1e8449; }
        .placed-incorrect { background: rgba(250, 219, 216, 0.9); color: #c0392b; }
        .info-row {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }
        .legend-inline {
            display: flex;
            gap: 16px;
            font-size: 11px;
            color: #555;
            margin-bottom: 2px;
        }
        .legend-dot {
            display: inline-block;
            width: 12px;
            height: 3px;
            border-radius: 2px;
            margin-right: 4px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="controls">
        <div class="legend-inline">
            <span><span class="legend-dot" style="background:#3498db;"></span>Type I</span>
            <span><span class="legend-dot" style="background:#27ae60;"></span>Type II</span>
            <span><span class="legend-dot" style="background:#e67e22;"></span>Type III</span>
        </div>
        <span style="margin-left: 8px;"></span>
        <button class="action-btn hint-btn" id="btn-hint" onclick="toggleHints()">Hints</button>
        <button class="action-btn reset-btn" onclick="resetAll()">Reset</button>
        <span class="score-display" id="score-display"></span>
    </div>
    <div class="main-area">
        <div class="chart-wrapper">
            <div class="chart-container">
                <canvas id="survChart"></canvas>
                <!-- Drop zones overlaid on the chart -->
                <div class="drop-overlay drop-type1" id="drop-type1"
                     ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)"
                     ondrop="handleDrop(event, 'I')" onclick="handleZoneClick('I')">
                    <span class="zone-label">Type I — low early mortality</span>
                </div>
                <div class="drop-overlay drop-type2" id="drop-type2"
                     ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)"
                     ondrop="handleDrop(event, 'II')" onclick="handleZoneClick('II')">
                    <span class="zone-label">Type II — constant mortality</span>
                </div>
                <div class="drop-overlay drop-type3" id="drop-type3"
                     ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)"
                     ondrop="handleDrop(event, 'III')" onclick="handleZoneClick('III')">
                    <span class="zone-label">Type III — high early mortality</span>
                </div>
            </div>
        </div>
        <div class="organism-panel">
            <div class="panel-title">Click or drag organisms to curves</div>
            <div id="organism-pool"></div>
        </div>
    </div>
    <div class="info-row" id="info-text">
        Click an organism, then click a curve zone — or drag and drop.
    </div>
</div>
<div id="return-link" style="display:none; padding: 8px 16px;">
    <a href=".">← Return to Lesson Plan</a>
</div>
<script>
    if (window.self === window.top) {
        document.getElementById('return-link').style.display = 'block';
    }
</script>
<script src="survivorship-curves.js"></script>
</body>
</html>
