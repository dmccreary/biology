<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Mendel-to-Meiosis Concept Map</title>
    <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="network"></div>

        <div class="title">Mendel-to-Meiosis Concept Map</div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-color color-meiosis"></div>
                <span><strong>Meiotic Events</strong></span>
            </div>
            <div class="legend-item">
                <div class="legend-color color-genetics"></div>
                <span><strong>Genetic Outcomes</strong></span>
            </div>
        </div>

        <div class="right-panel">
            <div class="status-info" id="status-info">
                <div class="status-title" id="info-title">Explore the Concept Map</div>
                <div class="status-text" id="info-text">
                    Hover over a node to learn about each concept. Click a node to highlight its connections.
                </div>
            </div>
            <div class="controls">
                <button class="btn btn-secondary" id="reset-btn">Reset View</button>
            </div>
        </div>
    </div>

    <script src="mendel-meiosis-map.js"></script>
</body>
</html>
