<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lactic Fermentation Explorer Wireframe</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 20px; background: #f6f6f6; color: #1d1d1d; }
    svg text { font-size: 13px; }
    .label { font-weight: bold; }
  </style>
</head>
<body>
  <h1>Lactic Fermentation Explorer Wireframe (Responsive width x 620px height)</h1>
  <svg width="900" height="680" viewBox="0 0 900 680">
    <defs>
      <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
        <path d="M0,0 L8,4 L0,8 Z" fill="#444"/>
      </marker>
    </defs>

    <!-- Drawing deck -->
    <rect x="20" y="20" width="860" height="460" fill="aliceblue" stroke="silver" stroke-width="2"/>
    <text x="30" y="38" class="label">Drawing Area (responsive width)</text>
    <line x1="40" y1="60" x2="840" y2="60" stroke="#444" stroke-width="2" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)"/>
    <text x="360" y="55">Width expands/shrinks with iframe</text>

    <!-- Title -->
    <rect x="60" y="70" width="780" height="60" fill="#ffe0ed" stroke="#888"/>
    <text x="450" y="105" text-anchor="middle" class="label">Title + Subtitle centered (65px reserved)</text>

    <!-- Mode strip -->
    <rect x="60" y="140" width="780" height="46" fill="#def1ff" stroke="#7ca7d6"/>
    <text x="70" y="168">Mode strip: Oxygen Debt / Oxygen Restored status + ETC indicator</text>

    <!-- Instruction banner -->
    <rect x="60" y="192" width="780" height="36" fill="#fff5d9" stroke="#d6a24a"/>
    <text x="70" y="214">Instruction banner with quick tutorial sentence</text>

    <!-- Flow panels container -->
    <rect x="50" y="240" width="800" height="190" fill="#d9ecff" stroke="#7ca7d6"/>
    <text x="60" y="258" class="label">Four-stage flow layout + NADH arc + organism row</text>

    <!-- Stage boxes -->
    <rect x="70" y="260" width="160" height="40" fill="#fffaf1" stroke="#c28f40"/>
    <text x="80" y="285">Stage 1: Glucose intake</text>
    <rect x="250" y="260" width="160" height="40" fill="#fff0d8" stroke="#c28f40"/>
    <text x="260" y="285">Stage 2: Glycolysis (2 ATP + 2 NADH)</text>
    <rect x="430" y="260" width="160" height="40" fill="#ffe5c2" stroke="#c28f40"/>
    <text x="440" y="285">Stage 3: Pyruvate pool</text>
    <rect x="610" y="260" width="160" height="40" fill="#ffdcb3" stroke="#c28f40"/>
    <text x="620" y="285">Stage 4: Lactate formation</text>
    <line x1="150" y1="300" x2="700" y2="300" stroke="#555" stroke-width="2" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)"/>
    <text x="360" y="295">Flow arrow with gradient highlighting</text>

    <!-- NADH arc -->
    <rect x="320" y="320" width="260" height="40" fill="#f7e6ff" stroke="#a861c7"/>
    <text x="330" y="345">NADH -> NAD+ arc text + curved arrow overlay</text>

    <!-- Waste + ATP badges -->
    <rect x="70" y="370" width="290" height="36" fill="#ffeecf" stroke="#d48b26"/>
    <text x="80" y="392">Waste badge (Lactate exported) with icon</text>
    <rect x="380" y="370" width="290" height="36" fill="#fff5d9" stroke="#d48b26"/>
    <text x="390" y="392">ATP tally badge (Net 2 ATP) with explanatory note</text>

    <!-- Organism row -->
    <rect x="50" y="410" width="800" height="50" fill="#fdf2ff" stroke="#be73c1"/>
    <text x="60" y="440">Organism chips (Muscle cell, RBC, Lactobacillus) + fun fact trigger note</text>

    <!-- Step narration -->
    <rect x="50" y="465" width="800" height="60" fill="#fff2d7" stroke="#d0993d"/>
    <text x="60" y="495" class="label">Step narration (4 steps) + progress bar</text>

    <!-- Control deck -->
    <rect x="20" y="500" width="860" height="150" fill="white" stroke="silver" stroke-width="2"/>
    <text x="30" y="520" class="label">Control Area (responsive)</text>
    <line x1="40" y1="545" x2="840" y2="545" stroke="#444" stroke-width="2" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)"/>
    <text x="330" y="540">Controls stretch horizontally with width</text>

    <!-- Controls row 1 -->
    <rect x="50" y="555" width="190" height="40" fill="#ffe4e2" stroke="#c77b77"/>
    <text x="60" y="580">Start/Pause Simulation button</text>
    <rect x="260" y="555" width="120" height="40" fill="#ffe4e2" stroke="#c77b77"/>
    <text x="270" y="580">Reset button</text>
    <rect x="390" y="555" width="180" height="40" fill="#fff1e4" stroke="#c77b77"/>
    <text x="400" y="580">Step display (Step X / 4)</text>
    <rect x="580" y="555" width="120" height="40" fill="#ffe4e2" stroke="#c77b77"/>
    <text x="590" y="580">Previous</text>
    <rect x="710" y="555" width="120" height="40" fill="#ffe4e2" stroke="#c77b77"/>
    <text x="720" y="580">Next</text>

    <!-- Controls row 2 -->
    <rect x="50" y="605" width="200" height="30" fill="#eaf4ff" stroke="#6c9fc8"/>
    <text x="60" y="625">Toggle: Show Oxygen Restored</text>
    <rect x="260" y="605" width="200" height="30" fill="#eaf4ff" stroke="#6c9fc8"/>
    <text x="270" y="625">Label: Auto Step Delay</text>
    <rect x="470" y="605" width="250" height="30" fill="#fdf6ea" stroke="#c77b77"/>
    <text x="480" y="625">Slider (1.0s - 4.0s)</text>
    <rect x="730" y="605" width="120" height="30" fill="#fff3e1" stroke="#c77b77"/>
    <text x="740" y="625">Value readout</text>
  </svg>

  <p>
    The layout reserves vertical spacing between every region; no rectangles overlap for widths between 450 px and 1200 px. Labels remain fully visible within their rectangles.
  </p>
</body>
</html>
