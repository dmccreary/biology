<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Species Interactions Web</title>
    <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="network"></div>

        <div class="title">Species Interactions Web</div>

        <div class="legend">
            <div class="legend-title">Edge Colors</div>
            <div class="legend-item">
                <div class="legend-line" style="background:#E74C3C;"></div>
                <span>Predation / Herbivory (+/−)</span>
            </div>
            <div class="legend-item">
                <div class="legend-line" style="background:#E67E22;"></div>
                <span>Competition (−/−)</span>
            </div>
            <div class="legend-item">
                <div class="legend-line" style="background:#27AE60;"></div>
                <span>Mutualism (+/+)</span>
            </div>
            <div class="legend-item">
                <div class="legend-line" style="background:#3498DB;"></div>
                <span>Commensalism (+/0)</span>
            </div>
            <div class="legend-item">
                <div class="legend-line" style="background:#8E44AD;"></div>
                <span>Parasitism (+/−)</span>
            </div>
        </div>

        <div class="right-panel">
            <div class="controls">
                <button class="btn btn-quiz" id="quiz-btn" onclick="toggleQuizMode()">Quiz Mode</button>
                <button class="btn btn-secondary" id="reset-btn">Reset</button>
            </div>

            <div id="quiz-panel" style="display:none;">
                <div class="quiz-prompt" id="quiz-prompt"></div>
                <div class="quiz-buttons" id="quiz-buttons"></div>
                <div class="quiz-score" id="quiz-score"></div>
            </div>

            <div class="status-info" id="status-info">
                <div class="status-title" id="info-title">Explore the Interaction Web</div>
                <div class="status-text" id="info-text">
                    Hover over an edge to see the interaction type. Click a species node to highlight all its interactions.
                </div>
            </div>
        </div>
    </div>

    <script src="species-interactions.js"></script>
</body>
</html>
