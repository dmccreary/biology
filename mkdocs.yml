site_name: AP Biology - An Interactive Course
repo_url: https://github.com/dmccreary/biology
site_url: https://dmccreary.github.io/biology/
site_description: An interactive intelligent textbook for AP Biology designed for college credit.
site_author: Dan McCreary

nav:
  - Home: index.md
  - Course Description: course-description.md
  - Chapters:
    - Overview: chapters/index.md
    - 1. Scientific Foundations and Atomic Chemistry: chapters/01-scientific-foundations-and-chemistry/index.md
    - 2. Water, pH, and Organic Chemistry: chapters/02-water-ph-and-organic-chemistry/index.md
    - 3. Biological Macromolecules: chapters/03-biological-macromolecules/index.md
    - 4. Cell Organization and Organelles: chapters/04-cell-organization-and-organelles/index.md
    - 5. Cell Membranes and Transport: chapters/05-cell-membranes-and-transport/index.md
    - 6. Thermodynamics and Enzyme Kinetics: chapters/06-thermodynamics-and-enzymes/index.md
    - 7. Photosynthesis: chapters/07-photosynthesis/index.md
    - 8. Cellular Respiration and Fermentation: chapters/08-cellular-respiration/index.md
    - 9. Cell Signaling and Feedback: chapters/09-cell-signaling-and-feedback/index.md
    - 10. The Cell Cycle, Mitosis, and Cancer: chapters/10-cell-cycle-mitosis-and-cancer/index.md
    - 11. Meiosis and Mendelian Genetics: chapters/11-meiosis-and-mendelian-genetics/index.md
    - 12. Non-Mendelian and Chromosomal Genetics: chapters/12-non-mendelian-and-chromosomal-genetics/index.md
    - 13. The Central Dogma: chapters/13-central-dogma-replication-and-protein-synthesis/index.md
    - 14. Mutations, Gene Regulation, and Biotechnology: chapters/14-mutations-gene-regulation-and-biotechnology/index.md
    - 15. Evidence for Evolution: chapters/15-evidence-for-evolution/index.md
    - 16. Population Genetics and Hardy-Weinberg: chapters/16-population-genetics-and-hardy-weinberg/index.md
    - 17. Speciation, Phylogenetics, and Macroevolution: chapters/17-speciation-phylogenetics-and-macroevolution/index.md
    - 18. Population Ecology and Life History: chapters/18-population-ecology-and-life-history/index.md
    - 19. Community Ecology and Species Interactions: chapters/19-community-ecology-and-species-interactions/index.md
    - 20. Ecosystem Ecology and Conservation: chapters/20-ecosystem-ecology-and-conservation/index.md

  - MicroSims:
    - List of MicroSims: sims/index.md
    - Animal Cell MicroSim: sims/animal-cell/index.md
    - Atomic Structure Explorer: sims/atomic-structure-explorer/index.md
    - Cell Membrane — Fluid Mosaic Model: sims/cell-membrane/index.md
    - Chemical Bond Visualizer: sims/chemical-bond-visualizer/index.md
    - Chemical Equation Rendering Pipeline: sims/chemical-equation-rendering/index.md
    - Chi-Square Test Calculator: sims/chi-square-calculator/index.md
    - Chloroplast & Light Reactions (Thylakoid Membrane): sims/chloroplast/index.md
    - DNA Double Helix Structure: sims/dna-double-helix/index.md
    - Mitochondria & Electron Transport Chain: sims/mitochondria/index.md
    - Neuron Structure: sims/neuron-structure/index.md
    - Plant Cell Drawing: sims/plant-cell/index.md
    - Scientific Method Workflow: sims/scientific-method/index.md
    - pH Scale Explorer: sims/ph-scale-explorer/index.md
    - Standard Deviation Visualization: sims/standard-deviation/index.md

  - Learning Graph:
    - Introduction: learning-graph/index.md
    - Course Description Assessment: learning-graph/course-description-assessment.md
    - Concept List: learning-graph/concept-list.md
    - Graph Quality Analysis: learning-graph/quality-metrics.md
    - Concept Taxonomy: learning-graph/concept-taxonomy.md
    - Taxonomy Distribution Report: learning-graph/taxonomy-distribution.md
    - Mascot Style Guide: learning-graph/mascot-style-guide.md
    - Mascot Test: learning-graph/mascot-test.md
    - Chemical Equation Tests: learning-graph/chemical-equation-tests.md
    - Index Template: learning-graph/index-template.md
    - Sample Biology Diagrams: learning-graph/sample-biology-diagrams.md
  
  - Prompts:
    - List of Prompts: prompts/index.md
    - prompts/01-seed-prompt.md
    - prompts/cover.md
    - prompts/04-biology-diagrams.md
    - prompts/05-mitosis-diagram-prompt.md
    - prompts/06-chapter-content-generation.md
    - prompts/08-standard-deviation-prompt.md

  - License: license.md

theme:
  name: material
  logo: img/logo.png
  favicon: img/favicon.ico
  palette:
    primary: 'green'
    accent: 'white'
  include_sidebar: true
  features:
    - content.code.copy
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - toc.follow
    - navigation.top
    - navigation.footer
    - content.action.edit

plugins:
  - search
  - social
  - social_override

markdown_extensions:
  - md_in_html
  - attr_list
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      linenums: true
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - css/extra.css
  - css/mascot.css

extra_javascript:
  - js/extra.js
  # This configuration file allows us to use the $ and $$ to specify and equation.
  # We never use backslash due to conflict with the []() Markdown format
  - js/mathjax-config.js
  # For a Biology textbook we use chemistry equations
  # We add the chemical markdown extension to MathJax
  # It is not included in the default MathJax bundle, so we need to load the full TeX bundle
  - https://unpkg.com/mathjax@3/es5/tex-chtml.js

# Watch these files for changes to trigger a rebuild
watch:
  - docs
  - mkdocs.yml

copyright: Copyright &copy; 2025 Dan McCreary. Licensed under <a href="license/">CC BY-NC-SA 4.0</a> for non-commercial use.

extra:
  generator: false  # remove the default "Made with MkDocs" footer

  # Google Analytics configuration
  analytics:
    provider: google
    property: G-MF2R7QQ4Q2
  # this book conforms to the v1 schema for intelligent textbooks
  schema: https://dmccreary.github.io/intelligent-textbooks/ns/textbook/v1
  textbook_name: Biology
  textbook_version: "1.0"
