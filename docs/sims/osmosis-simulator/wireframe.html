<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Osmosis Simulator Wireframe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        svg {
            width: 100%;
            height: auto;
            max-width: 900px;
            border: 1px solid #ccc;
            background: #fff;
        }
        text {
            font-size: 12px;
            fill: #111;
        }
    </style>
</head>
<body>
    <h1>Wireframe Plan — Osmosis &amp; Water Potential Simulator</h1>
    <p>All rectangles are positioned without overlap between 0–1200px widths.</p>
    <svg viewBox="0 0 900 520" role="img" aria-label="Wireframe plan for Osmosis simulator">
        <!-- Title -->
        <rect x="20" y="20" width="860" height="50" fill="#fdd835" stroke="#333" />
        <text x="30" y="50">Rect T — Title Bar</text>

        <!-- Drawing region -->
        <rect x="20" y="80" width="860" height="240" fill="#e3f2fd" stroke="#333" />
        <text x="30" y="100">Rect D — Drawing Region</text>

        <!-- Left chamber -->
        <rect x="40" y="110" width="430" height="200" fill="#bbdefb" stroke="#0d47a1" />
        <text x="50" y="130">Rect L — Cell Interior</text>

        <!-- Gauge -->
        <rect x="40" y="110" width="40" height="200" fill="#c8e6c9" stroke="#1b5e20" />
        <text x="45" y="150" transform="rotate(-90 60 150)">Rect G — Turgor Gauge</text>

        <!-- Membrane -->
        <rect x="480" y="110" width="20" height="200" fill="#fffde7" stroke="#f57f17" stroke-dasharray="6 4" />
        <text x="485" y="130" transform="rotate(-90 490 130)">Rect M — Membrane</text>

        <!-- Right chamber -->
        <rect x="500" y="110" width="320" height="200" fill="#c5e1a5" stroke="#33691e" />
        <text x="510" y="130">Rect R — External Solution</text>

        <!-- Annotation panel -->
        <rect x="830" y="110" width="50" height="200" fill="#ffe0b2" stroke="#e65100" />
        <text x="835" y="150" transform="rotate(-90 855 150)">Rect A — Stage Data</text>

        <!-- Control panel -->
        <rect x="20" y="330" width="860" height="170" fill="#ffffff" stroke="#333" />
        <text x="30" y="350">Rect C — Control Panel</text>

        <!-- Control blocks -->
        <rect x="40" y="360" width="240" height="40" fill="#d1c4e9" stroke="#4527a0" />
        <text x="50" y="385">Rect S1 — Internal Solute Slider</text>

        <rect x="300" y="360" width="240" height="40" fill="#b39ddb" stroke="#311b92" />
        <text x="310" y="385">Rect S2 — External Solute Slider</text>

        <rect x="560" y="360" width="240" height="40" fill="#9575cd" stroke="#4a148c" />
        <text x="570" y="385">Rect S3 — Temperature Slider</text>

        <rect x="40" y="410" width="280" height="40" fill="#ffccbc" stroke="#bf360c" />
        <text x="50" y="435">Rect T1 — Cell Mode Toggle</text>

        <rect x="340" y="410" width="260" height="40" fill="#ffe082" stroke="#ff6f00" />
        <text x="350" y="435">Rect D1 — Ψ Calculations</text>

        <rect x="620" y="410" width="160" height="40" fill="#ffab91" stroke="#d84315" />
        <text x="630" y="435">Rect W — Warning Badge</text>

        <rect x="40" y="460" width="160" height="30" fill="#cfd8dc" stroke="#263238" />
        <text x="50" y="480">Start/Pause Button</text>

        <rect x="210" y="460" width="160" height="30" fill="#b0bec5" stroke="#37474f" />
        <text x="220" y="480">Equilibrate Button</text>
    </svg>
</body>
</html>
