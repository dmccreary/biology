<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
  <title>Cell Junctions Explorer — Interactive Diagram</title>
  <link rel="stylesheet" href="../shared-libs/style.css">
  <style>
    .quadrant-label {
      position: absolute;
      font-size: 16px;
      font-weight: 700;
      color: #2C3E50;
      background: rgba(255, 255, 255, 0.85);
      padding: 2px 10px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 8;
      letter-spacing: 0.02em;
    }
    .ql-top-left   { top: 2%;  left: 12%;  transform: translateX(-50%); }
    .ql-top-right  { top: 2%;  left: 62%; transform: translateX(-50%); }
    .ql-bot-left   { top: 52%; left: 12%;  transform: translateX(-50%); }
    .ql-bot-right  { top: 52%; left: 62%; transform: translateX(-50%); }
  </style>
</head>
<body>

<div id="layout">
  <svg id="leaders-svg"></svg>

  <div id="diagram-wrapper">
    <img id="diagram-img" src="cell-junctions.png" alt="Four types of cell junctions: tight junction, desmosome, gap junction, and plasmodesma shown in cross-section between adjacent cells" draggable="false">
    <div class="quadrant-label ql-top-left">Tight Junction</div>
    <div class="quadrant-label ql-top-right">Desmosome</div>
    <div class="quadrant-label ql-bot-left">Gap Junction</div>
    <div class="quadrant-label ql-bot-right">Plasmodesma</div>
    <div id="markers-layer"></div>
  </div>

  <div id="label-panel">
    <!-- label rows injected by diagram.js -->
  </div>
</div>

<div id="controls">
  <button class="mode-btn active" id="btn-explore" onclick="sim.setMode('explore')">Explore</button>
  <button class="mode-btn"        id="btn-quiz"    onclick="sim.setMode('quiz')">Quiz</button>
  <span id="quiz-score" style="display:none">
    Score: <strong id="score-val">0</strong> / <strong id="score-total">0</strong>
  </span>
</div>

<div id="infobox">
  <div id="infobox-prompt">Hover over a numbered marker or a label to learn about that structure.</div>
  <div id="infobox-content">
    <div id="infobox-label"></div>
    <div id="infobox-desc"></div>
    <div id="infobox-ap-tip"></div>
    <button id="quiz-restart" onclick="sim.restartQuiz()">Try Again</button>
  </div>
</div>

<div id="edit-panel">
  <h3>Edit Mode — drag markers to calibrate positions</h3>
  <div id="coord-display">Drag a marker to see its live coordinates.</div>
  <textarea id="json-output" readonly spellcheck="false"></textarea>
  <div id="edit-actions">
    <button id="copy-json-btn" onclick="sim.copyJSON()">Copy JSON</button>
    <span id="copy-confirm"></span>
  </div>
</div>

<div id="return-link" style="display:none; padding: 8px 16px;">
    <a href=".">← Return to Lesson Plan</a>
</div>
<script>
    if (window.self === window.top) {
        document.getElementById('return-link').style.display = 'block';
    }
</script>

<script src="../shared-libs/diagram.js"></script>
</body>
</html>
