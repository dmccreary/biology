<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Selection Modes Visualizer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: aliceblue;
        }
        .container {
            max-width: 100%;
            padding: 6px 10px;
        }
        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }
        .mode-btn {
            padding: 6px 16px;
            border: 2px solid #ccc;
            border-radius: 6px;
            background: #e8e8e8;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .mode-btn:hover { background: #d0d0d0; }
        .mode-btn.active-stabilizing { background: #3498db; color: white; border-color: #2980b9; }
        .mode-btn.active-directional { background: #e67e22; color: white; border-color: #d35400; }
        .mode-btn.active-disruptive { background: #e74c3c; color: white; border-color: #c0392b; }
        .action-btn {
            padding: 6px 14px;
            border: 1px solid #999;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .run-btn { background: #2ecc71; color: white; border-color: #27ae60; }
        .run-btn:hover { background: #27ae60; }
        .reset-btn { background: #95a5a6; color: white; border-color: #7f8c8d; }
        .reset-btn:hover { background: #7f8c8d; }
        .overlay-btn { background: #9b59b6; color: white; border-color: #8e44ad; }
        .overlay-btn.active { background: #8e44ad; }
        .overlay-btn:not(.active) { background: #ddd; color: #666; border-color: #ccc; }
        .chart-container {
            position: relative;
            width: 100%;
            height: 320px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #555;
            margin-top: 4px;
        }
        .gen-counter {
            font-weight: bold;
            font-size: 14px;
            color: #333;
        }
        .description {
            font-size: 11px;
            color: #666;
            max-width: 500px;
        }
        .speed-control {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
        }
        .speed-control input { width: 80px; }
    </style>
</head>
<body>
<div class="container">
    <div class="controls">
        <button class="mode-btn active-stabilizing" id="btn-stabilizing" onclick="setMode('stabilizing')">Stabilizing</button>
        <button class="mode-btn" id="btn-directional" onclick="setMode('directional')">Directional</button>
        <button class="mode-btn" id="btn-disruptive" onclick="setMode('disruptive')">Disruptive</button>
        <span style="margin-left: 12px;"></span>
        <button class="action-btn run-btn" id="btn-run" onclick="toggleRun()">▶ Run</button>
        <button class="action-btn reset-btn" onclick="resetSim()">Reset</button>
        <button class="action-btn overlay-btn" id="btn-overlay" onclick="toggleOverlay()">Show Original</button>
        <div class="speed-control">
            <label>Speed:</label>
            <input type="range" id="speed-slider" min="1" max="10" value="5">
        </div>
    </div>
    <div class="chart-container">
        <canvas id="selectionChart"></canvas>
    </div>
    <div class="info-row">
        <span class="gen-counter" id="gen-display">Generation: 0 / 30</span>
        <span class="description" id="mode-desc">Stabilizing selection: extreme phenotypes are selected against; the population narrows around the mean.</span>
    </div>
</div>
<script src="selection-modes.js"></script>
</body>
</html>
