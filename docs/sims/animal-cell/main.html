<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Cell — Interactive Diagram</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8f9fa;
      color: #1a1a1a;
      padding: 12px;
    }

    /* ── Controls bar ───────────────────────────────────── */
    #controls {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .mode-btn {
      padding: 5px 18px;
      border: 2px solid #bbb;
      border-radius: 20px;
      background: white;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s;
    }
    .mode-btn:hover  { border-color: #4A6FA5; color: #4A6FA5; }
    .mode-btn.active { background: #4A6FA5; color: white; border-color: #4A6FA5; }
    .mode-btn:disabled { opacity: 0.4; cursor: default; }

    #edit-badge {
      background: #C45C2A;
      color: white;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    #quiz-score {
      margin-left: auto;
      font-size: 13px;
      color: #555;
    }
    #quiz-score strong { color: #1a1a1a; }

    /* ── Diagram wrapper ────────────────────────────────── */
    #diagram-wrapper {
      position: relative;
      display: block;
      width: 100%;
      line-height: 0;
    }

    #diagram-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 6px;
      border: 1px solid #ddd;
      user-select: none;
      -webkit-user-select: none;
    }

    #markers-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* ── Markers ────────────────────────────────────────── */
    .marker {
      position: absolute;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #4A6FA5;
      color: white;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translate(-50%, -50%);
      cursor: pointer;
      pointer-events: all;
      border: 2px solid white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
      transition: transform 0.12s, background 0.12s;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    .marker:hover,
    .marker.active       { background: #2A4F85; transform: translate(-50%,-50%) scale(1.25); z-index: 10; }
    .marker.quiz-unknown { background: #777; cursor: crosshair; }
    .marker.correct      { background: #2A8040; transform: translate(-50%,-50%) scale(1.25); }
    .marker.incorrect    { background: #C02020; animation: shake 0.35s ease; }
    .marker.edit-mode    { background: #C45C2A; cursor: grab; }
    .marker.edit-mode:active { cursor: grabbing; }

    @keyframes shake {
      0%,100% { transform: translate(-50%,-50%) translateX(0); }
      25%      { transform: translate(-50%,-50%) translateX(-5px); }
      75%      { transform: translate(-50%,-50%) translateX(5px); }
    }

    /* ── Infobox ────────────────────────────────────────── */
    #infobox {
      margin-top: 10px;
      min-height: 130px;
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 14px 18px;
    }

    #infobox-prompt {
      color: #999;
      font-style: italic;
      font-size: 14px;
      margin-top: 8px;
    }

    #infobox-content { display: none; }

    #infobox-label {
      font-size: 19px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 7px;
    }
    #infobox-label.correct-label { color: #2A8040; }
    #infobox-label.prompt-label  { color: #4A6FA5; }

    #infobox-desc {
      font-size: 14px;
      line-height: 1.6;
      color: #333;
      margin-bottom: 10px;
    }

    #infobox-ap-tip {
      display: none;
      background: #FFF8E0;
      border-left: 3px solid #F5A623;
      padding: 7px 11px;
      font-size: 13px;
      line-height: 1.55;
      border-radius: 0 4px 4px 0;
      color: #444;
    }
    #infobox-ap-tip strong { color: #8B6000; }

    #quiz-restart {
      display: none;
      margin-top: 10px;
      padding: 6px 18px;
      background: #4A6FA5;
      color: white;
      border: none;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    #quiz-restart:hover { background: #2A4F85; }

    /* ── Edit panel ─────────────────────────────────────── */
    #edit-panel {
      display: none;
      margin-top: 10px;
      background: #1e1e2e;
      border-radius: 8px;
      padding: 14px 16px;
      color: #cdd6f4;
    }

    #edit-panel h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #89b4fa;
      margin-bottom: 10px;
    }

    #coord-display {
      font-family: monospace;
      font-size: 13px;
      color: #a6e3a1;
      min-height: 20px;
      margin-bottom: 10px;
    }

    #json-output {
      width: 100%;
      height: 200px;
      font-family: monospace;
      font-size: 11px;
      background: #11111b;
      color: #cdd6f4;
      border: 1px solid #45475a;
      border-radius: 4px;
      padding: 8px;
      resize: vertical;
    }

    #edit-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }

    #copy-json-btn {
      padding: 6px 16px;
      background: #89b4fa;
      color: #1e1e2e;
      border: none;
      border-radius: 4px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    #copy-json-btn:hover { background: #74c7ec; }

    #copy-confirm {
      font-size: 12px;
      color: #a6e3a1;
    }
  </style>
</head>
<body>

<div id="controls">
  <button class="mode-btn active" id="btn-explore" onclick="sim.setMode('explore')">Explore</button>
  <button class="mode-btn"        id="btn-quiz"    onclick="sim.setMode('quiz')">Quiz</button>
  <span id="quiz-score" style="display:none">
    Score: <strong id="score-val">0</strong> / <strong id="score-total">0</strong>
  </span>
</div>

<div id="diagram-wrapper">
  <img id="diagram-img" src="animal-cell.png" alt="Animal Cell Diagram" draggable="false">
  <div id="markers-layer"></div>
</div>

<div id="infobox">
  <div id="infobox-prompt">Hover over a numbered marker to learn about that structure.</div>
  <div id="infobox-content">
    <div id="infobox-label"></div>
    <div id="infobox-desc"></div>
    <div id="infobox-ap-tip"></div>
    <button id="quiz-restart" onclick="sim.restartQuiz()">Try Again</button>
  </div>
</div>

<div id="edit-panel">
  <h3>Edit Mode — drag markers to calibrate positions</h3>
  <div id="coord-display">Drag a marker to see its live coordinates.</div>
  <textarea id="json-output" readonly spellcheck="false"></textarea>
  <div id="edit-actions">
    <button id="copy-json-btn" onclick="sim.copyJSON()">Copy JSON</button>
    <span id="copy-confirm"></span>
  </div>
</div>

<script src="diagram.js"></script>
</body>
</html>
