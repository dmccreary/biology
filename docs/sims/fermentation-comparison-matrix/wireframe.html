<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fermentation Comparison Matrix Wireframe</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 20px; background: #f4f4f9; color: #1d1d1d; }
    svg text { font-size: 13px; }
    .label { font-weight: bold; }
  </style>
</head>
<body>
  <h1>Fermentation Comparison Matrix Wireframe (Responsive width x 540px height)</h1>
  <svg width="900" height="600" viewBox="0 0 900 600">
    <defs>
      <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
        <path d="M0,0 L8,4 L0,8 Z" fill="#444"/>
      </marker>
    </defs>

    <!-- Drawing area -->
    <rect x="20" y="20" width="860" height="380" fill="aliceblue" stroke="silver" stroke-width="2"/>
    <text x="30" y="38" class="label">Drawing Area (comparison grid + quiz overlay)</text>
    <line x1="40" y1="60" x2="840" y2="60" stroke="#444" stroke-width="2" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)"/>
    <text x="350" y="55">Responsive width</text>

    <!-- Title -->
    <rect x="60" y="70" width="780" height="55" fill="#f6e9ff" stroke="#9d7cc5"/>
    <text x="450" y="105" text-anchor="middle" class="label">Title + subtitle + quick instruction</text>

    <!-- Reveal buttons strip -->
    <rect x="60" y="135" width="780" height="40" fill="#e2f3ff" stroke="#7ca9c8"/>
    <text x="70" y="160">Row reveal buttons (1 per row) + \"Reveal All\" button</text>

    <!-- Comparison grid -->
    <rect x="50" y="185" width="800" height="190" fill="#ffffff" stroke="#8cb0c9"/>
    <text x="60" y="203" class="label">Comparison Matrix</text>
    <line x1="50" y1="225" x2="850" y2="225" stroke="#cfcfcf"/>
    <line x1="50" y1="260" x2="850" y2="260" stroke="#cfcfcf"/>
    <line x1="50" y1="295" x2="850" y2="295" stroke="#cfcfcf"/>
    <line x1="50" y1="330" x2="850" y2="330" stroke="#cfcfcf"/>
    <line x1="50" y1="365" x2="850" y2="365" stroke="#cfcfcf"/>
    <!-- Column divider -->
    <line x1="450" y1="185" x2="450" y2="375" stroke="#8cb0c9" stroke-width="2"/>
    <text x="250" y="210" class="label">Lactic Column</text>
    <text x="650" y="210" class="label">Alcoholic Column</text>
    <text x="60" y="240">Row 1: Organisms / context</text>
    <text x="60" y="275">Row 2: Waste products</text>
    <text x="60" y="310">Row 3: Gas release</text>
    <text x="60" y="345">Row 4: ATP yield</text>
    <text x="60" y="380">Row 5: NAD+ recycling notes</text>

    <!-- Quiz overlay notice -->
    <rect x="50" y="385" width="800" height="30" fill="#fff7dd" stroke="#d4a642"/>
    <text x="60" y="405">Quiz mode instructions + drag targets appear here</text>

    <!-- Step/summary area -->
    <rect x="50" y="420" width="800" height="40" fill="#f0f5ff" stroke="#95a8d5"/>
    <text x="60" y="445" class="label">Summary text once rows are revealed / quiz results feedback</text>

    <!-- Control deck -->
    <rect x="20" y="460" width="860" height="120" fill="white" stroke="silver" stroke-width="2"/>
    <text x="30" y="480" class="label">Control Area</text>
    <line x1="40" y1="505" x2="840" y2="505" stroke="#444" stroke-width="2" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)"/>
    <text x="330" y="500">Controls stretch with width</text>

    <!-- Controls -->
    <rect x="50" y="515" width="200" height="36" fill="#ffe4e1" stroke="#c37a72"/>
    <text x="60" y="538">Start Comparison button</text>
    <rect x="270" y="515" width="150" height="36" fill="#ffe4e1" stroke="#c37a72"/>
    <text x="280" y="538">Reset Grid</text>
    <rect x="440" y="515" width="150" height="36" fill="#fff2e2" stroke="#c37a72"/>
    <text x="450" y="538">Enter Quiz Mode toggle</text>
    <rect x="610" y="515" width="240" height="36" fill="#e7f5ff" stroke="#7aa2c5"/>
    <text x="620" y="538">Button cluster: Reveal All / Hide All</text>

    <rect x="50" y="560" width="200" height="30" fill="#eaf4ff" stroke="#7aa2c5"/>
    <text x="60" y="580">Status indicator (e.g., \"Rows revealed: 3/5\")</text>
    <rect x="270" y="560" width="320" height="30" fill="#fdf6e8" stroke="#c37a72"/>
    <text x="280" y="580">Row reveal slider (optional manual control)</text>
    <rect x="610" y="560" width="240" height="30" fill="#fff3df" stroke="#c37a72"/>
    <text x="620" y="580">Message area (quiz feedback)</text>
  </svg>

  <p>
    The matrix, summary, and control regions are vertically separated with explicit heights, preventing overlap across responsive widths between 450 px and 1200 px.
  </p>
</body>
</html>
