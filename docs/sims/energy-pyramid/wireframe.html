<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Energy Pyramid Wireframe</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; background: #fafafa; margin: 20px; }
    svg text { font-size: 14px; fill: #1d1d1d; }
    .label { font-weight: bold; }
  </style>
</head>
<body>
  <h1>Energy Pyramid Wireframe (780 × 490 reference)</h1>
  <svg width="780" height="490" viewBox="0 0 780 490" style="border:1px solid #ccc; background: aliceblue;">
    <!-- Title -->
    <rect x="24" y="12" width="732" height="52" fill="#FFD7E6" stroke="#555"/>
    <text x="30" y="42" class="label">Title Banner</text>

    <!-- Instruction strip -->
    <rect x="150" y="70" width="480" height="28" fill="#E0F0FF" stroke="#555"/>
    <text x="160" y="88">Instruction Strip</text>

    <!-- Pyramid canvas -->
    <rect x="24" y="110" width="470" height="210" fill="#CDE7FF" stroke="#555"/>
    <text x="34" y="130" class="label">Pyramid Canvas</text>

    <!-- Detail panel -->
    <rect x="514" y="110" width="242" height="230" fill="#F4E4FF" stroke="#555"/>
    <text x="524" y="130" class="label">Detail Panel</text>

    <!-- Heat band -->
    <rect x="24" y="320" width="732" height="40" fill="#FFF5CC" stroke="#555"/>
    <text x="34" y="344">Heat / Energy Loss Band</text>

    <!-- Control area background -->
    <rect x="0" y="380" width="780" height="110" fill="#FFFFFF" stroke="#555"/>

    <!-- Control rows -->
    <rect x="10" y="390" width="760" height="30" fill="#FFE8CC" stroke="#bbb"/>
    <text x="20" y="410">Row 1: Producer Input Slider</text>

    <rect x="10" y="425" width="760" height="30" fill="#FFECCF" stroke="#bbb"/>
    <text x="20" y="445">Row 2: Transfer Efficiency Slider</text>

    <rect x="10" y="460" width="760" height="25" fill="#FFF2D9" stroke="#bbb"/>
    <text x="20" y="478">Row 3: Add Level Button + Toggles</text>
  </svg>
</body>
</html>
